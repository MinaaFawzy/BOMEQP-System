<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Register</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div class="bg-blobs" aria-hidden="true">
    <span class="blob b1"></span>
    <span class="blob b2"></span>
    <span class="blob b3"></span>
  </div>

  <main class="page">
    <section class="shell">
      <header class="topbar">
        <div>
          <h1>إنشاء حساب</h1>
          <p>اختار نوع التسجيل وكمّل البيانات. تصميم حديث وسلس ✨</p>
        </div>

        <div class="segmented" role="tablist" aria-label="Account type">
          <button class="seg-btn active" data-type="training" role="tab" aria-selected="true">
            Training Center
          </button>
          <button class="seg-btn" data-type="accreditation" role="tab" aria-selected="false">
            Accreditation Body
          </button>
        </div>
      </header>

      <form id="registerForm" class="card" novalidate>
        <!-- Shared Section: Auth -->
        <section class="section">
          <div class="section-head">
            <h2>بيانات الدخول</h2>
            <span class="hint">* حقول مطلوبة</span>
          </div>

          <div class="grid">
            <div class="field">
              <label id="legalNameLabel">Company name <span class="req">*</span></label>
              <input id="legalName" type="text" placeholder="اكتب الاسم القانوني" autocomplete="organization" required />
              <small class="error"></small>
            </div>

            <div class="field">
              <label>Website</label>
              <input id="website" type="url" placeholder="https://example.com" autocomplete="url" />
              <small class="error"></small>
            </div>

            <div class="field">
              <label>Email address <span class="req">*</span></label>
              <input id="email" type="email" placeholder="name@company.com" autocomplete="email" required />
              <small class="error"></small>
            </div>

            <div class="field">
              <label>Password <span class="req">*</span></label>
              <div class="input-icon">
                <input id="password" type="password" placeholder="••••••••" autocomplete="new-password" required />
                <button class="icon-btn" type="button" data-toggle="password" aria-label="Show password">👁️</button>
              </div>
              <small class="error"></small>
            </div>

            <div class="field">
              <label>Confirm password <span class="req">*</span></label>
              <div class="input-icon">
                <input id="confirmPassword" type="password" placeholder="••••••••" autocomplete="new-password" required />
                <button class="icon-btn" type="button" data-toggle="confirmPassword" aria-label="Show password">👁️</button>
              </div>
              <small class="error"></small>
            </div>

            <div class="field">
              <label>Telephone Number <span class="req">*</span></label>
              <input id="telephone" type="tel" placeholder="+20 ..." autocomplete="tel" required />
              <small class="error"></small>
            </div>

            <div class="field">
              <label>Fax</label>
              <input id="fax" type="text" placeholder="Fax (optional)" />
              <small class="error"></small>
            </div>

            <!-- Training only -->
            <div class="field only-training" data-only="training">
              <label>Training Provider Type <span class="req">*</span></label>
              <select id="providerType" required>
                <option value="" selected disabled>اختر النوع</option>
                <option>Training center</option>
                <option>Institute</option>
                <option>University</option>
              </select>
              <small class="error"></small>
            </div>
          </div>
        </section>

        <!-- Physical address -->
        <section class="section">
          <div class="section-head">
            <h2>Physical address <span class="req">*</span></h2>
          </div>

          <div class="grid">
            <div class="field">
              <label>Address <span class="req">*</span></label>
              <input id="pAddress" type="text" placeholder="Street, building..." required />
              <small class="error"></small>
            </div>
            <div class="field">
              <label>City <span class="req">*</span></label>
              <input id="pCity" type="text" required />
              <small class="error"></small>
            </div>
            <div class="field">
              <label>Country <span class="req">*</span></label>
              <input id="pCountry" type="text" required />
              <small class="error"></small>
            </div>
            <div class="field">
              <label>Postal code <span class="req">*</span></label>
              <input id="pPostal" type="text" required />
              <small class="error"></small>
            </div>
          </div>
        </section>

        <!-- Mailing address -->
        <section class="section">
          <div class="section-head">
            <h2 id="mailingTitle">Mailing address</h2>
          </div>

          <div class="row">
            <label class="check">
              <input id="sameAsPhysical" type="checkbox" checked />
              <span>Same as Physical address</span>
            </label>
          </div>

          <div id="mailingGrid" class="grid muted">
            <div class="field">
              <label>Address</label>
              <input id="mAddress" type="text" placeholder="Mailing address..." />
              <small class="error"></small>
            </div>
            <div class="field">
              <label>City</label>
              <input id="mCity" type="text" />
              <small class="error"></small>
            </div>
            <div class="field">
              <label>Country</label>
              <input id="mCountry" type="text" />
              <small class="error"></small>
            </div>
            <div class="field">
              <label>Postal code</label>
              <input id="mPostal" type="text" />
              <small class="error"></small>
            </div>
          </div>

          <div class="note">
            <span class="dot"></span>
            <p id="mailingNote">
              Training Center: Mailing address غير مطلوب.  
              Accreditation: Mailing address مطلوب.
            </p>
          </div>
        </section>

        <!-- Primary contact -->
        <section class="section">
          <div class="section-head">
            <h2>Primary Contact <span class="req">*</span></h2>
          </div>

          <div class="grid">
            <div class="field">
              <label>Title <span class="req">*</span></label>
              <select id="pcTitle" required>
                <option value="" selected disabled>اختر</option>
                <option>Mr.</option>
                <option>Mrs.</option>
                <option>Eng.</option>
                <option>Prof.</option>
              </select>
              <small class="error"></small>
            </div>

            <div class="field">
              <label>First Name <span class="req">*</span></label>
              <input id="pcFirst" type="text" required />
              <small class="error"></small>
            </div>

            <div class="field">
              <label>Last Name <span class="req">*</span></label>
              <input id="pcLast" type="text" required />
              <small class="error"></small>
            </div>

            <div class="field">
              <label>E-mail address <span class="req">*</span></label>
              <input id="pcEmail" type="email" required />
              <small class="error"></small>
            </div>

            <div class="field">
              <label>Country <span class="req">*</span></label>
              <input id="pcCountry" type="text" required />
              <small class="error"></small>
            </div>

            <div class="field">
              <label>Mobile Number <span class="req">*</span></label>
              <input id="pcMobile" type="tel" required />
              <small class="error"></small>
            </div>

            <!-- Accreditation only: passport upload for primary -->
            <div class="field only-accreditation" data-only="accreditation">
              <label>Upload passport copy <span class="req">*</span></label>
              <input id="pcPassport" type="file" accept=".pdf,.jpg,.jpeg,.png" />
              <small class="error"></small>
            </div>
          </div>
        </section>

        <!-- Secondary contact toggle -->
        <section class="section">
          <div class="section-head">
            <h2>Secondary Contact</h2>
          </div>

          <div class="row">
            <label class="check">
              <input id="addSecondContact" type="checkbox" />
              <span>إضافة جهة اتصال ثانية</span>
            </label>
          </div>

          <div id="secondaryWrap" class="collapse">
            <div class="grid">
              <div class="field">
                <label>Title <span class="req sec-req">*</span></label>
                <select id="scTitle">
                  <option value="" selected disabled>اختر</option>
                  <option>Mr.</option>
                  <option>Mrs.</option>
                  <option>Eng.</option>
                  <option>Prof.</option>
                </select>
                <small class="error"></small>
              </div>

              <div class="field">
                <label>First Name <span class="req sec-req">*</span></label>
                <input id="scFirst" type="text" />
                <small class="error"></small>
              </div>

              <div class="field">
                <label>Last Name <span class="req sec-req">*</span></label>
                <input id="scLast" type="text" />
                <small class="error"></small>
              </div>

              <div class="field">
                <label>E-mail address <span class="req sec-req">*</span></label>
                <input id="scEmail" type="email" />
                <small class="error"></small>
              </div>

              <div class="field">
                <label>Country <span class="req sec-req">*</span></label>
                <input id="scCountry" type="text" />
                <small class="error"></small>
              </div>

              <div class="field">
                <label>Mobile Number <span class="req sec-req">*</span></label>
                <input id="scMobile" type="tel" />
                <small class="error"></small>
              </div>

              <!-- Accreditation only: passport upload for secondary -->
              <div class="field only-accreditation" data-only="accreditation">
                <label>Upload passport copy <span class="req sec-req">*</span></label>
                <input id="scPassport" type="file" accept=".pdf,.jpg,.jpeg,.png" />
                <small class="error"></small>
              </div>
            </div>
          </div>
        </section>

        <!-- Additional info -->
        <section class="section">
          <div class="section-head">
            <h2>Additional Info</h2>
          </div>

          <div class="grid">
            <div class="field">
              <label>Company GOV Registry Number <span class="req">*</span></label>
              <input id="govReg" type="text" required />
              <small class="error"></small>
            </div>

            <div class="field">
              <label>Upload the Company Registration Certificate <span class="req">*</span></label>
              <input id="companyCert" type="file" accept=".pdf,.jpg,.jpeg,.png" required />
              <small class="error"></small>
            </div>

            <!-- Training only: floorplan + interested fields -->
            <div class="field only-training" data-only="training">
              <label>Upload facility floorplan <span class="req">*</span></label>
              <input id="floorplan" type="file" accept=".pdf,.jpg,.jpeg,.png" />
              <small class="error"></small>
            </div>

            <div class="field only-training" data-only="training">
              <label>Interested Fields</label>
              <div class="chips">
                <label class="chip"><input type="checkbox" value="QHSE" name="interests"> <span>QHSE</span></label>
                <label class="chip"><input type="checkbox" value="Food Safety" name="interests"> <span>Food Safety</span></label>
                <label class="chip"><input type="checkbox" value="Management" name="interests"> <span>Management</span></label>
              </div>
              <small class="error"></small>
            </div>

            <div class="field">
              <label>How did you hear about us?</label>
              <input id="hearAbout" type="text" placeholder="Referral / Social / Search ..." />
              <small class="error"></small>
            </div>
          </div>
        </section>

        <!-- Consents -->
        <section class="section">
          <div class="section-head">
            <h2>الموافقات <span class="req">*</span></h2>
          </div>

          <div class="consents">
            <label class="check">
              <input id="consentComms" type="checkbox" required />
              <span id="consentCommsText">I agreed to receive other communications from (Accreditation Name).</span>
            </label>

            <p class="tiny">
              <a href="#" class="link">Privacy Policy</a>
            </p>

            <label class="check">
              <input id="consentTerms" type="checkbox" required />
              <span>I confirm that I have read, understood, and accepted the terms and conditions.</span>
            </label>

            <small class="error" id="consentError"></small>
          </div>
        </section>

        <footer class="actions">
          <button type="button" class="btn ghost" id="previewDataBtn">Preview Data</button>
          <button type="submit" class="btn primary">Create account</button>
        </footer>

        <div id="toast" class="toast" role="status" aria-live="polite"></div>
      </form>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
